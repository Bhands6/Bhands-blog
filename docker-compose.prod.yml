# ---------------------------------------------------------------------------
# 生产部署编排：MySQL + Redis + Next.js 应用
# 用法：deploy/部署说明.md（所有密码在 deploy/env.production 里配置）
#
# 安全设计：
#   MySQL / Redis 不映射任何端口到宿主与公网，只走 compose 内部网络；
#   例外是 MySQL 额外绑定了 127.0.0.1:3306 —— 仅供构建期（network: host）
#   与宿主上的运维命令（mysqldump）使用，公网不可达。
# ---------------------------------------------------------------------------

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bhands_blog}
      MYSQL_USER: ${MYSQL_USER:-nexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./deploy/data/mysql:/var/lib/mysql
    ports:
      # 只绑回环：构建期（network: host）与宿主运维使用，公网不可达
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./deploy/data/redis:/data

  app:
    build:
      context: .
      # 构建期 SSG 页面会连数据库：共享宿主网络后直连 127.0.0.1:3306
      network: host
      args:
        DATABASE_URL: mysql://${MYSQL_USER:-nexus}:${MYSQL_PASSWORD}@127.0.0.1:3306/${MYSQL_DATABASE:-bhands_blog}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: blog-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./deploy/env.production
    environment:
      NODE_ENV: production
      # 运行时走 compose 内部网络直连服务名（与构建期地址不同：构建用宿主回环）
      DATABASE_URL: mysql://${MYSQL_USER:-nexus}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-bhands_blog}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      # 只绑回环：由宿主上的 Caddy 反代并终结 HTTPS
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/zh').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
